# Shared development environment for this gem.
# Local overrides belong in .env.local (loaded via dotenvy through mise).

[env]
DEBUG = "false"
FLOSS_CFG_FUND_DEBUG = "false"
FLOSS_CFG_FUND_LOGFILE = "tmp/log/debug.log"
FUNDING_ORG = "rubocop-lts"
KETTLE_DEV_DEBUG = "false"
KETTLE_TEST_SILENT = "true"
K_SOUP_COV_COMMAND_NAME = "Test Coverage"
K_SOUP_COV_DO = "true"
K_SOUP_COV_FORMATTERS = "html,xml,rcov,lcov,json,tty"
K_SOUP_COV_MIN_BRANCH = "76"
K_SOUP_COV_MIN_HARD = "true"
K_SOUP_COV_MIN_LINE = "92"
K_SOUP_COV_MULTI_FORMATTERS = "true"
K_SOUP_COV_OPEN_BIN = ""
MAX_ROWS = "1"
OPENCOLLECTIVE_HANDLE = "rubocop-lts"
_.file = { path = ".env.local", redact = true }
_.path = ["exe", "bin"]
_.source = ".config/mise/env.sh"

[tools]
ruby = "4.0.5"

[tasks.readiness]
raw = true
description = "Run family readiness checks without changing files"
run = "bundle exec kettle-family check"

[tasks.test]
raw = true
description = "Run every family member test suite"
run = "bundle exec kettle-family test --execute"

[tasks.lint]
raw = true
description = "Run read-only lint checks across family members"
run = "bundle exec kettle-family lint --execute"

[tasks.lint-fix]
raw = true
description = "Autocorrect lint issues across family members without committing"
run = "bundle exec kettle-family bex --execute --no-commit -- bin/rake rubocop_gradual:autocorrect"

[tasks.check]
description = "Run readiness, lint, and tests across the family"
depends = ["readiness", "lint", "test"]
run = "true"

[tasks.state]
raw = true
description = "Report release state for every family member"
run = "bundle exec kettle-family state"

[tasks.install]
raw = true
description = "Build and install selected family gems locally"
run = "bundle exec kettle-family install --execute"

[tasks.template]
raw = true
description = "Apply kettle-jem templates across family members"
run = "bundle exec kettle-family template --execute"

[tasks.docs]
raw = true
description = "Generate documentation across family members"
run = "bundle exec kettle-family docs --execute"

[tasks.deps]
raw = true
description = "Update dependencies from released sources without committing"
run = "bundle exec kettle-family bup --execute --no-commit"

[tasks.deps-local]
raw = true
description = "Update dependencies against local Kettle sources"
run = "KETTLE_DEV_DEV={{config_root}}/../../kettle-dev bundle exec kettle-family bup --execute --no-commit"

[tasks.deps-release]
raw = true
description = "Update dependencies from released sources and commit lockfiles"
run = "KETTLE_DEV_DEV=false bundle exec kettle-family bup --execute --commit"

[tasks.bump]
description = "Bump family versions; pass VERSION or major/minor/patch/pre"
raw = true
run = "bundle exec kettle-family bump"

[tasks.changelog]
description = "Add a structured entry to a member Unreleased changelog"
raw = true
run = "bundle exec kettle-family add-changelog --execute"

[tasks.clean]
raw = true
description = "Remove locally installed family versions newer than released"
run = "bundle exec kettle-family clean-unreleased --execute"

[tasks.pins]
raw = true
description = "Review and update GitHub Actions pins across the family"
run = "bundle exec kettle-family gha-sha-pins --execute"

[tasks.release-plan]
description = "Plan the family publish without changing files"
raw = true
run = "bundle exec kettle-family release --publish --secrets-provider op"

[tasks.release]
description = "Publish the family; pass release options after --"
raw = true
run = "bundle exec kettle-family release --execute --publish --secrets-provider op"
